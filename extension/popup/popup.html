<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garmin Connect Night</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Connect Night</h1>
        <p>Athletic midnight theme</p>
      </div>
    </header>
    <label class="row">
      <span>Dark theme</span>
      <input type="checkbox" id="toggle" checked />
    </label>
    <p class="hint">Reload Garmin tab if styles look stuck.</p>
    <script src="popup.js"></script>
  </body>
</html>
